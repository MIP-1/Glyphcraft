<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Glyphcraft</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=UnifrakturCook:ital,wght@0,700;1,700&family=Crimson+Text:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="menubar">
      <div class="menubar-left">
        <div class="menu">
          <button class="menu-btn" id="menu-file">File</button>
          <div class="menu-dropdown" id="dropdown-file">
            <button class="menu-item" data-action="open">Open Image…</button>
            <button class="menu-item" data-action="export">Export Image…</button>
            <button class="menu-item" data-action="reset">Reset All</button>
            <hr class="menu-sep">
            <button class="menu-item" data-action="load-preset">Load Preset…</button>
            <button class="menu-item" data-action="save-preset">Save Preset…</button>
          </div>
        </div>
        <div class="menu">
          <button class="menu-btn" id="menu-view">View</button>
          <div class="menu-dropdown" id="dropdown-view">
            <label class="menu-item checkbox">
              <input type="checkbox" id="toggle-theme" checked> Dark Theme
            </label>
            <hr class="menu-sep">
            <button class="menu-item" data-action="fit">Fit to Window</button>
            <button class="menu-item" data-action="compare">Compare (Split View)</button>
            <button class="menu-item" data-action="original">Show Original (Hold)</button>
          </div>
        </div>
        <div class="menu">
          <button class="menu-btn" id="menu-edit">Edit</button>
          <div class="menu-dropdown" id="dropdown-edit">
            <button class="menu-item" data-action="undo">Undo</button>
            <button class="menu-item" data-action="redo">Redo</button>
          </div>
        </div>
      </div>
      <div class="menubar-right">
        <button class="menu-btn panel-toggle-btn" id="panel-toggle-btn" aria-label="Toggle panel" style="display: none;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18M15 3v18"/></svg>
        </button>
        <span class="status" id="status-bar">No image loaded</span>
      </div>
    </header>

    <main class="workspace">
      <section class="canvas-area" id="canvas-area">
        <canvas id="canvas"></canvas>
        <div class="drop-zone" id="drop-zone" data-state="idle">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/>
          </svg>
          <span class="hint">Drop image or video here, or click to open</span>
          <span class="drop-error" style="display:none; color:var(--accent); font-size:12px; margin-top:8px;"></span>
          <div class="drop-loading" style="display:none; margin-top:8px;">
            <div class="spinner" style="width:24px;height:24px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite;margin:0 auto;"></div>
          </div>
        </div>
        <div class="compare-overlay" id="compare-overlay" style="display:none;">
          <div class="compare-slider" id="compare-slider"></div>
        </div>
      </section>

      <aside class="panel" id="panel">
        <button class="panel-toggle" id="panel-toggle" aria-label="Collapse panel">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
        <div class="panel-content">
          <header class="panel-header">
            <h1 class="logo">Glyphcraft</h1>
          </header>

          <div class="panel-actionbar" id="panel-actionbar">
            <button class="btn btn-primary" id="btn-export">Export Image</button>
            <button class="btn btn-secondary" id="btn-reset">Reset All</button>
          </div>

          <input type="search" class="panel-search" id="panel-search" placeholder="Search controls…">

          <section class="panel-section" id="section-mode">
            <div class="section-header">
              <h2 class="section-title">Mode</h2>
              <button class="section-reset" data-section="mode">Reset</button>
            </div>
            <div class="dropdown-wrap">
              <select id="select-mode">
                <option value="script">Script</option>
                <option value="dither">Dither</option>
                <option value="effects">Effects Only</option>
              </select>
            </div>
          </section>

          <section class="panel-section" id="section-script">
            <div class="section-header">
              <h2 class="section-title">Script Options</h2>
              <button class="section-reset" data-section="script">Reset</button>
            </div>
            <div class="control">
              <label class="control-label"><span>Depth</span><span class="control-value" id="val-depth">80</span></label>
              <div class="control-input-wrap">
                <input type="range" id="depth" min="20" max="240" value="80" step="1">
                <input type="number" id="depth-num" min="20" max="240" value="80" step="1">
              </div>
            </div>
            <div class="control-row">
              <div class="control half">
                <label class="control-label">Category</label>
                <select id="char-category">
                  <option value="all">All</option>
                  <option value="letters">Letters</option>
                  <option value="numbers">Numbers</option>
                  <option value="symbols">Symbols</option>
                  <option value="letters-numbers">Letters+Numbers</option>
                </select>
              </div>
              <div class="control half">
                <label class="control-label">Set</label>
                <select id="char-set">
                  <option value="all">All</option>
                  <option value="consonants">Consonants</option>
                  <option value="vowels">Vowels</option>
                  <option value="uppercase">Uppercase</option>
                  <option value="lowercase">Lowercase</option>
                  <option value="binary">Binary</option>
                </select>
              </div>
            </div>
            <div class="control">
              <label class="control-label">Inject Characters</label>
              <input type="text" id="char-inject" placeholder="Extra glyphs to add" spellcheck="false">
            </div>
            <div class="control">
              <label class="control-label"><span>Offset</span><span class="control-value" id="val-offset">0</span></label>
              <div class="control-input-wrap">
                <input type="range" id="char-offset" min="-50" max="50" value="0" step="1">
                <input type="number" id="char-offset-num" min="-50" max="50" value="0" step="1">
              </div>
            </div>
            <div class="control-row">
              <div class="control half">
                <label class="control-label">Text Style</label>
                <select id="text-style">
                  <option value="regular">Regular</option>
                  <option value="bold">Bold</option>
                  <option value="italic">Italic</option>
                </select>
              </div>
            </div>
            <div class="control checkboxes">
              <label class="checkbox"><input type="checkbox" id="use-palette" checked> Use Palette</label>
              <label class="checkbox"><input type="checkbox" id="transparent-bg"> Transparent Background</label>
              <label class="checkbox"><input type="checkbox" id="auto-levels" checked> Auto Levels</label>
            </div>
            <div class="control">
              <label class="control-label">Background Color</label>
              <input type="color" id="bg-color" value="#0b0b0c">
            </div>
            <div class="control">
              <label class="control-label">Charset Preset</label>
              <select id="char-preset">
                <option value="custom">Custom</option>
                <option value="ascii">ASCII (95 chars)</option>
                <option value="blocks">Blocks (96 chars)</option>
                <option value="braille">Braille (256 chars)</option>
                <option value="binary">Binary (0,1)</option>
                <option value="minimal">Minimal (@#:.)</option>
                <option value="dense">Dense (█▓▒░)</option>
              </select>
            </div>
            <div class="control" id="custom-charset-row" style="display: none;">
              <label class="control-label">Custom Charset</label>
              <input type="text" id="custom-charset" placeholder="Custom characters for ramp" spellcheck="false">
            </div>
            <div class="control-row">
              <div class="control half">
                <label class="control-label"><span>Cell Size</span><span class="control-value" id="val-cell-size">8</span></label>
                <div class="control-input-wrap">
                  <input type="range" id="cell-size" min="4" max="32" value="8" step="1">
                  <input type="number" id="cell-size-num" min="4" max="32" value="8" step="1">
                </div>
              </div>
              <div class="control half">
                <label class="control-label"><span>Weight</span><span class="control-value" id="val-weight">400</span></label>
                <div class="control-input-wrap">
                  <input type="range" id="glyph-weight" min="100" max="900" value="400" step="100">
                  <input type="number" id="glyph-weight-num" min="100" max="900" value="400" step="100">
                </div>
              </div>
            </div>
            <div class="control checkboxes">
              <label class="checkbox"><input type="checkbox" id="glyph-invert"> Invert Ramp</label>
              <label class="checkbox"><input type="checkbox" id="glyph-color"> Color Mode</label>
              <label class="checkbox"><input type="checkbox" id="use-palette" checked> Use Palette</label>
              <label class="checkbox"><input type="checkbox" id="transparent-bg"> Transparent Background</label>
              <label class="checkbox"><input type="checkbox" id="auto-levels" checked> Auto Levels</label>
            </div>
            <div class="control">
              <label class="control-label">Background Color</label>
              <input type="color" id="bg-color" value="#0b0b0c">
            </div>
          </section>

          <section class="panel-section" id="section-dither">
            <div class="section-header">
              <h2 class="section-title">Dither Options</h2>
              <button class="section-reset" data-section="dither">Reset</button>
            </div>
            <div class="control">
              <label class="control-label">Kernel</label>
              <select id="dither-kernel">
                <optgroup label="Error Diffusion">
                  <option value="floyd-steinberg">Floyd–Steinberg</option>
                  <option value="atkinson">Atkinson</option>
                  <option value="sierra">Sierra</option>
                  <option value="stucki">Stucki</option>
                  <option value="burkes">Burkes</option>
                  <option value="jarvis-judice-ninke">Jarvis-Judice-Ninke</option>
                </optgroup>
                <optgroup label="Ordered">
                  <option value="bayer2">Bayer 2×2</option>
                  <option value="bayer4">Bayer 4×4</option>
                  <option value="bayer8">Bayer 8×8</option>
                </optgroup>
                <optgroup label="Other">
                  <option value="halftone">Halftone Dot Grid</option>
                  <option value="threshold">Threshold</option>
                  <option value="blue-noise">Blue Noise</option>
                  <option value="random">Random</option>
                </optgroup>
              </select>
            </div>
            <div class="control">
              <label class="control-label"><span>Color Depth</span><span class="control-value" id="val-color-depth">4</span></label>
              <div class="control-input-wrap">
                <input type="range" id="dither-depth" min="2" max="16" value="4" step="1">
                <input type="number" id="dither-depth-num" min="2" max="16" value="4" step="1">
              </div>
            </div>
            <div class="control checkboxes">
              <label class="checkbox"><input type="checkbox" id="dither-serpentine" checked> Serpentine (boustrophedon)</label>
            </div>
          </section>

          <section class="panel-section" id="section-color">
            <div class="section-header">
              <h2 class="section-title">Color</h2>
              <button class="section-reset" data-section="color">Reset</button>
            </div>
            <div class="control">
              <label class="control-label">Mode</label>
              <select id="color-mode">
                <option value="spectrum">Full Spectrum</option>
                <option value="palette">Palette</option>
                <option value="mono">Mono</option>
              </select>
            </div>
            <div class="control" id="control-palette">
              <label class="control-label">Palette</label>
              <select id="palette-select"></select>
            </div>
            <div class="palette-swatches" id="palette-swatches"></div>
            <div class="control" id="custom-palette-builder" style="display: none;">
              <label class="control-label">Custom Palette</label>
              <div class="palette-builder" id="palette-builder"></div>
              <div class="control-row">
                <div class="control half">
                  <button class="btn btn-small" id="palette-add-color">Add Color</button>
                </div>
                <div class="control half">
                  <button class="btn btn-small" id="palette-save-custom">Save as Preset</button>
                </div>
              </div>
            </div>
          </section>

          <section class="panel-section" id="section-adjustments">
            <div class="section-header">
              <h2 class="section-title">Adjustments</h2>
              <button class="section-reset" data-section="adjustments">Reset</button>
            </div>
            <div class="control">
              <label class="control-label"><span>Brightness</span><span class="control-value" id="val-brightness">0</span><span class="control-unit">%</span></label>
              <div class="control-input-wrap">
                <input type="range" id="adj-brightness" min="-100" max="100" value="0" step="1">
                <input type="number" id="adj-brightness-num" min="-100" max="100" value="0" step="1">
              </div>
            </div>
            <div class="control">
              <label class="control-label"><span>Contrast</span><span class="control-value" id="val-contrast">0</span><span class="control-unit">%</span></label>
              <div class="control-input-wrap">
                <input type="range" id="adj-contrast" min="-100" max="100" value="0" step="1">
                <input type="number" id="adj-contrast-num" min="-100" max="100" value="0" step="1">
              </div>
            </div>
            <div class="control">
              <label class="control-label"><span>Saturation</span><span class="control-value" id="val-saturation">0</span><span class="control-unit">%</span></label>
              <div class="control-input-wrap">
                <input type="range" id="adj-saturation" min="-100" max="100" value="0" step="1">
                <input type="number" id="adj-saturation-num" min="-100" max="100" value="0" step="1">
              </div>
            </div>
            <div class="control">
              <label class="control-label"><span>Hue</span><span class="control-value" id="val-hue">0</span><span class="control-unit">°</span></label>
              <div class="control-input-wrap">
                <input type="range" id="adj-hue" min="-180" max="180" value="0" step="1">
                <input type="number" id="adj-hue-num" min="-180" max="180" value="0" step="1">
              </div>
            </div>
            <div class="control">
              <label class="control-label"><span>Highlights</span><span class="control-value" id="val-highlights">0</span><span class="control-unit">%</span></label>
              <div class="control-input-wrap">
                <input type="range" id="adj-highlights" min="-100" max="100" value="0" step="1">
                <input type="number" id="adj-highlights-num" min="-100" max="100" value="0" step="1">
              </div>
            </div>
            <div class="control">
              <label class="control-label"><span>Shadows</span><span class="control-value" id="val-shadows">0</span><span class="control-unit">%</span></label>
              <div class="control-input-wrap">
                <input type="range" id="adj-shadows" min="-100" max="100" value="0" step="1">
                <input type="number" id="adj-shadows-num" min="-100" max="100" value="0" step="1">
              </div>
            </div>
            <div class="control">
              <label class="control-label"><span>Sharpen</span><span class="control-value" id="val-sharpen">0</span><span class="control-unit">%</span></label>
              <div class="control-input-wrap">
                <input type="range" id="adj-sharpen" min="0" max="100" value="0" step="1">
                <input type="number" id="adj-sharpen-num" min="0" max="100" value="0" step="1">
              </div>
            </div>
            <div class="control">
              <label class="control-label"><span>Blur</span><span class="control-value" id="val-blur">0</span><span class="control-unit">px</span></label>
              <div class="control-input-wrap">
                <input type="range" id="adj-blur" min="0" max="20" value="0" step="1">
                <input type="number" id="adj-blur-num" min="0" max="20" value="0" step="1">
              </div>
            </div>
            <div class="control checkboxes">
              <label class="checkbox"><input type="checkbox" id="adj-invert"> Invert</label>
              <label class="checkbox"><input type="checkbox" id="adj-sepia"> Sepia</label>
            </div>
          </section>

          <section class="panel-section" id="section-effects">
            <div class="section-header">
              <h2 class="section-title">Effects</h2>
              <button class="section-reset" data-section="effects">Reset</button>
            </div>
            <div class="presets-bar" id="presets-bar">
              <button class="preset-btn" data-preset="terminal">Terminal Green</button>
              <button class="preset-btn" data-preset="newsprint">Newsprint</button>
              <button class="preset-btn" data-preset="cyber">Cyber Glitch</button>
              <button class="preset-btn" data-preset="gameboy">Game Boy</button>
              <button class="preset-btn" data-preset="blueprint">Blueprint</button>
              <button class="preset-btn" data-preset="oldphoto">Old Photo</button>
              <button class="preset-btn" data-preset="thermal">Neon Thermal</button>
            </div>
            <div class="effects-list" id="effects-list"></div>
          </section>

          <section class="panel-section" id="section-output">
            <div class="section-header">
              <h2 class="section-title">Output</h2>
              <button class="section-reset" data-section="output">Reset</button>
            </div>
            <div class="control">
              <label class="control-label">Format</label>
              <select id="export-format">
                <option value="png">PNG</option>
                <option value="jpg">JPG</option>
                <option value="webp">WebP</option>
                <option value="svg">SVG (Script only)</option>
                <option value="txt">TXT (Script only)</option>
                <option value="webm">WebM Video</option>
              </select>
            </div>
            <div class="control" id="jpg-quality-control" style="display: none;">
              <label class="control-label"><span>JPG Quality</span><span class="control-value" id="val-jpg-quality">90</span><span class="control-unit">%</span></label>
              <div class="control-input-wrap">
                <input type="range" id="jpg-quality" min="10" max="100" value="90" step="1">
                <input type="number" id="jpg-quality-num" min="10" max="100" value="90" step="1">
              </div>
            </div>
            <div class="control">
              <label class="control-label">Size Preset</label>
              <div class="preset-select-wrap">
                <input type="search" id="output-preset-search" placeholder="Search presets…" class="preset-search">
                <select id="output-preset"></select>
              </div>
            </div>
            <div class="control-row" id="output-custom-row" style="display: none;">
              <div class="control half">
                <label class="control-label">Width</label>
                <input type="number" id="output-width" min="1" max="8192" value="1920">
              </div>
              <div class="control half">
                <label class="control-label">Height</label>
                <input type="number" id="output-height" min="1" max="8192" value="1080">
              </div>
            </div>
            <div class="control-row">
              <div class="control half">
                <label class="control-label">Fit</label>
                <select id="output-fit">
                  <option value="contain">Contain</option>
                  <option value="cover">Cover</option>
                  <option value="stretch">Stretch</option>
                </select>
              </div>
              <div class="control half">
                <label class="control-label checkbox">
                  <input type="checkbox" id="output-lock-ratio" checked> Lock Ratio
                </label>
              </div>
            </div>
            <div class="control hidden" id="output-warn">
              <span style="color: var(--accent); font-size: 12px;">⚠ Large output may be slow to render/export</span>
            </div>
          </section>
        </div>
      </aside>
    </main>
  </div>

  <input type="file" id="file-input" accept="image/*,video/*" style="display:none">
  <script src="engine.js"></script>
  <script src="effects.js"></script>
  <script src="app.js"></script>
</body>
</html>
